var DC=`// Arduino Mega simulator — drive a servo from the joystick.
// Wire up: joystick VRx → A0, VRy → A1, SW → D2, GND → GND, 5V → 5V
//          servo SIG → D5, GND → GND, 5V → 5V
//          LED anode → D13, cathode → GND
//
// Drag the joystick knob to drive the servo. Press Run ▶ to start.

#include <Servo.h>

Servo myservo;

const int ledPin   = 13;
const int servoPin = 5;
const int joyXPin  = A0;
const int joyYPin  = A1;
const int joySwPin = 2;

void setup() {
  Serial.begin(9600);
  pinMode(ledPin, OUTPUT);
  pinMode(joySwPin, INPUT_PULLUP);
  myservo.attach(servoPin);
  Serial.println("Ready. Drag the joystick!");
}

void loop() {
  int x  = analogRead(joyXPin);
  int y  = analogRead(joyYPin);
  int sw = digitalRead(joySwPin);

  int angle = map(x, 0, 1023, 0, 180);
  myservo.write(angle);

  digitalWrite(ledPin, sw == LOW ? HIGH : LOW);

  Serial.print("x=");   Serial.print(x);
  Serial.print(" y=");   Serial.print(y);
  Serial.print(" sw=");  Serial.print(sw);
  Serial.print(" servo="); Serial.println(angle);

  delay(120);
}`;
var BC=`// Blink the onboard LED (D13).
void setup() {
  Serial.begin(9600);
  pinMode(13, OUTPUT);
  Serial.println("Blink starting...");
}
void loop() {
  digitalWrite(13, HIGH);
  Serial.println("LED ON");
  delay(500);
  digitalWrite(13, LOW);
  Serial.println("LED OFF");
  delay(500);
}`;
var TC=`// Drive the ST7789 TFT display.
// Wiring: 5V -> 5V, GND -> GND
//         DC -> D9, CS -> D10, RST -> D8, MOSI -> D51

#include <Adafruit_GFX.h>
#include <Adafruit_ST7789.h>

#define TFT_CS    10
#define TFT_DC     9
#define TFT_RST    8

Adafruit_ST7789 tft = Adafruit_ST7789(TFT_CS, TFT_DC, TFT_RST);

int frame = 0;

void setup() {
  Serial.begin(9600);
  Serial.println("TFT init...");
  tft.init(240, 320);
  tft.fillScreen(ST77XX_BLACK);
  tft.setCursor(40, 100);
  tft.setTextColor(ST77XX_GREEN);
  tft.setTextSize(3);
  tft.print("Hello, Mega!");
  tft.setCursor(40, 140);
  tft.setTextColor(ST77XX_CYAN);
  tft.setTextSize(2);
  tft.print("ST7789 240x320");
  delay(1500);
}

void loop() {
  tft.fillScreen(ST77XX_BLACK);
  int cx = 120 + (int)(80.0 * sin(frame * 0.05));
  int cy = 160 + (int)(100.0 * cos(frame * 0.07));
  tft.fillCircle(cx, cy, 18, ST77XX_MAGENTA);
  tft.drawCircle(cx, cy, 22, ST77XX_WHITE);
  tft.setCursor(8, 4);
  tft.setTextColor(ST77XX_YELLOW);
  tft.setTextSize(2);
  tft.print("f=");
  tft.print(frame);
  frame++;
  delay(40);
}`;

function highlight(src){var t=[],i=0;while(i<src.length){var c=src[i];if(c==='/'&&src[i+1]==='/'){var j=i;while(j<src.length&&src[j]!=='\n')j++;t.push({t:src.slice(i,j),c:'tok-com'});i=j;continue}if(c==='/'&&src[i+1]==='*'){var j=i+2;while(j<src.length&&!(src[j]==='*'&&src[j+1]==='/'))j++;j=Math.min(src.length,j+2);t.push({t:src.slice(i,j),c:'tok-com'});i=j;continue}if(c==='#'){var j=i;while(j<src.length&&src[j]!=='\n')j++;t.push({t:src.slice(i,j),c:'tok-pre'});i=j;continue}if(c=='"'){var j=i+1;while(j<src.length&&src[j]!=='"'){if(src[j]==='\\')j++;j++}j++;t.push({t:src.slice(i,j),c:'tok-str'});i=j;continue}if(c=="'"){var j=i+1;while(j<src.length&&src[j]!=="'"){if(src[j]==='\\')j++;j++}j++;t.push({t:src.slice(i,j),c:'tok-str'});i=j;continue}if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(src[i+1]||''))){var j=i;if(c==='0'&&(src[i+1]==='x'||src[i+1]==='X')){j=i+2;while(j<src.length&&/[0-9a-fA-F]/.test(src[j]))j++}else{while(j<src.length&&/[0-9.]/.test(src[j]))j++;if(src[j]==='e'||src[j]==='E'){j++;if(src[j]==='+'||src[j]==='-')j++;while(j<src.length&&/[0-9]/.test(src[j]))j++}}while(j<src.length&&/[uUlLfF]/.test(src[j]))j++;t.push({t:src.slice(i,j),c:'tok-num'});i=j;continue}if(/[A-Za-z_]/.test(c)){var j=i;while(j<src.length&&/[A-Za-z0-9_]/.test(src[j]))j++;var w=src.slice(i,j);var cls='';if(KW2.has(w))cls='tok-kw';else if(AC.has(w))cls='tok-const';else if(AF.has(w))cls='tok-fn';else{var k=j;while(k<src.length&&src[k]===' ')k++;if(src[k]==='(')cls='tok-fn'}t.push({t:w,c:cls});i=j;continue}t.push({t:c,c:''});i++}return t.map(function(x){var e=x.t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');return x.c?'<span class="'+x.c+'">'+e+'</span>':e}).join('')}
